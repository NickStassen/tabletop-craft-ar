# TabletopCraftAR plugin configuration. See docs/PROTOCOL.md.
bind:
  host: 0.0.0.0
  port: 8765
  path: /tabletop
auth:
  # Shared secret the headset sends in hello. Empty = auth disabled (LAN dev only). [talk] Server commands from the
  # headset (commands below) need it by default; it travels in clear on the LAN (ws://).
  token: ""
# LAN discovery (PROTOCOL.md 7): the headset's "Find servers" (block menu > Info > Server) broadcasts a small UDP probe
# and this server answers with its name, the WebSocket port and path above, and whether a token is needed. Only
# private, link-local and loopback addresses get an answer. Open UDP 8765 in the PC's firewall too (QUEST_SETUP Part A);
# without it the headset falls back to scanning the LAN for TCP port 8765.
discovery:
  enabled: true
  port: 8765
  # Name shown on the headset's button. Empty = the server's MOTD (server.properties motd).
  name: ""
region:
  # Default region sent after welcome. Origin is the min (north-west, bottom) corner.
  world: world
  origin: { x: 0, y: 60, z: 0 }
  dims: { x: 32, y: 64, z: 32 }
stream:
  # Full diff of every subscribed region every N ticks; catches /fill, /setblock, WorldEdit.
  safety-diff-ticks: 20
  # player_positions every N ticks (2 = 10 Hz).
  players-every-ticks: 2
  # Players within the region box + this margin (x, z and y) are sent; spectators, invisible players and players
  # hidden by a vanish plugin (or from any other player) never are.
  players-margin: 16
  # Send chunk_snapshot as 16^3 sections (split into messages, deltas when the region moves by whole sections) to
  # clients that advertise "sections_v1" (PROTOCOL.md 4.18). false = always one rle_palette_v1 message.
  sections-v1: true
  # Target size of one sectioned chunk_snapshot message (bytes of JSON).
  max-message-bytes: 1048576
  # Per-block light and 4x4x4 biomes for clients that ask for them in hello.caps (light_v1 / biomes_v1,
  # PROTOCOL.md 4.4.1). Clients without those caps never pay the bytes. Set false to never send them.
  light: true
  biomes: true
  # [area] Main-thread time per tick for copying chunks (ChunkSnapshots) when a region is read or diffed. A 288x288
  # region (a 256-wide window plus margins) is 361 chunks, about 3 ms warm and 6 ms right after generation, so it
  # is spread over a few ticks. A READS line every 30 s logs the cost. 0 = all in one tick.
  snapshot-budget-ms: 1.5
# Non-player entities (boats, minecarts, mobs, dropped items, item frames...) for clients that ask for them in
# hello.caps (entities_v1, PROTOCOL.md 4.21), sent with player_positions as deltas. Players are always in
# player_positions; the giant's own entities are never sent.
entities:
  enabled: true
  # Max entities per region; the ones nearest the region centre win.
  max: 256
  # Entities inside the region box grown by this many blocks are sent.
  margin: 2
# Actions for clients that ask for them (actions_v1, PROTOCOL.md 4.22): arm swings, digging cracks, block break and
# place particles, red damage flashes. One message per tick with what happened inside the client's region.
actions:
  enabled: true
avatar:
  # Real metres per block on the table; the Quest overrides it with avatar_config.
  block-size-m: 0.01
  # What Java players see of the headset user (ARCHITECTURE.md 3.5):
  #   floating: a giant player head (your skin) and two hands, no body, exactly where the headset and controllers
  #             are relative to the table (origin + pose / block-size-m), turned with them (yaw, pitch and roll).
  #   ground:   a Mannequin body standing on the terrain under the headset's X/Z, clamped into the region; hands
  #             keep your real head-to-hand offsets scaled up to its size.
  #   exact:    a Mannequin whose head and hands are at the mapped positions; the body hangs below the head.
  placement: floating
  # floating: real head and hand sizes, scaled like the table (0.25 m at 0.01 m/block = a 25-block head).
  head-size-m: 0.25
  hand-size-m: 0.1
  # floating: largest head in blocks; the hands shrink by the same factor (0 = no cap).
  max-head-blocks: 64
  # floating: hand block, or "auto" for the plain block closest to the skin's hand colour.
  hand-block: auto
  # ground/exact: cap on the Mannequin SCALE attribute (16 = 28.8 blocks tall, the attribute's maximum).
  max-scale: 16.0
  # ground/exact: real height of the headset user. Hand offsets are scaled by giant height / this.
  user-height-m: 1.75
  # ground/exact: per-tick smoothing of the Mannequin's position and head rotation, 0.05..1 (1 = off). Jumps
  # over 16 blocks snap. Floating displays are smoothed by the clients (interpolation-ticks).
  smoothing: 0.5
  # Java account whose skin the giant wears when the headset sends no skin_player (tabletop.json). The server
  # looks it up on the Mojang API (works in offline mode too, needs internet); Java clients also resolve it.
  skin-player: ""
  # Teleport/transform interpolation of the head and hand displays, in ticks.
  interpolation-ticks: 2
  # Spawn the giant when poses arrive even if no avatar_config was sent.
  spawn-on-first-pose: true
  despawn-after-disconnect-ms: 10000
edit:
  # Break and place blocks from the headset (block_edit, PROTOCOL.md 4.20). Headsets that ask for edit_v1 in hello.caps
  # get it in welcome.caps; edits are only applied inside the table's region. On by default for a LAN dev server.
  enabled: true
  # true: only allow editing when auth.token is set above (then every connected headset presented the token).
  require-token: false
  # Edits per second per headset (token bucket); more get error rate_limited.
  max-per-second: 20
  # Block physics after an edit (sand falls, water flows, torches without support pop off), as when a player edits.
  physics: true
  # Blocks that can never be placed from the headset (operator-only blocks).
  deny:
    - minecraft:command_block
    - minecraft:chain_command_block
    - minecraft:repeating_command_block
    - minecraft:structure_block
    - minecraft:jigsaw
    - minecraft:test_block
    - minecraft:test_instance_block
# [talk] Chat between Java players and the headset (chat_v1, PROTOCOL.md 4.26). Headsets that ask for chat_v1 get
# game chat, joins, quits, deaths, advancements, plugin broadcasts and /say, /me; with "send" they can talk too.
chat:
  enabled: true
  # Let headsets send chat (chat_send). Off = they only read.
  send: true
  # What Java players see. <name> is the headset's operator_name (tabletop.json; else its skin_player, else
  # default-name), cut to letters, digits and _ (16 at most); <message> is the text. Both are inserted as plain text
  # (MiniMessage tags typed on the headset stay literal). Keep a fixed prefix such as [Giant] so a headset can't pass
  # for a real player. These are server messages: not signed, and chat plugins that listen to player chat don't see them.
  format: "<gold>[Giant]</gold> <name>: <message>"
  # /me from the headset.
  me-format: "<gold>* [Giant]</gold> <name> <message>"
  default-name: Tabletop
  max-length: 256
  # Chat messages per second per headset (a token bucket of "burst"); more get error rate_limited.
  max-per-second: 2
  burst: 5
  # The headset's line floats above the giant's head for Java players for this many seconds (0 = off).
  bubble-seconds: 5
# [talk] Server commands from the headset (command_v1, PROTOCOL.md 4.27). A headset command runs with operator
# rights (like the console), so by default it needs auth.token: without a token there is no command_v1 at all.
# SECURITY: the link is plain ws:// on the LAN. The token and every command travel unencrypted, and anyone who can
# sniff the LAN can replay the token. Use it only on a network you trust; ARCHITECTURE.md 6 has wss:// beyond that.
commands:
  enabled: true
  # true: commands only when auth.token above is set (every connected headset presented it).
  require-token: true
  # Commands per second per headset (a token bucket of "burst"). Tab completions and the world/players queries share
  # their own limit (completions-per-second).
  max-per-second: 2
  burst: 5
  completions-per-second: 10
  max-length: 256
  # Non-empty: only these commands may run (roots; "tp" and "teleport" are separate entries).
  allow: []
  # Never from the headset. Aliases resolve (rl is reload, minecraft:stop is stop), and execute ... run stop is
  # checked too.
  deny: [stop, restart, reload, op, deop, ban, ban-ip, pardon, pardon-ip, whitelist, save-off, debug, jfr, perf, transfer]
  # Ops (permission tabletop.notify) see "[Tabletop: /command]" in grey when a headset runs one.
  notify-ops: true
  # Quick buttons in the headset's Console tab (tabletop.json "quick_commands" adds its own).
  quick: ["time set day", "weather clear", "tick freeze", "tick unfreeze"]
# [talk] Server status for headsets (status_v1, PROTOCOL.md 4.28): server_status (TPS, MSPT, memory, players, worlds)
# every every-ticks ticks, world_info (time, weather, difficulty, gamerules) and players_info on request.
status:
  enabled: true
  every-ticks: 40
debug:
  # Broadcast avatar_state with a "debug" object (entity positions) every 10 ticks.
  avatar-state: false
  log-poses: false
# Server caps for region_request / subscribe / setsize (PROTOCOL.md 4.13).
# Sized for a 256-block visible box plus the headset's 16-block view margin (docs/TESTING.md "Navigation and bigger
# areas": a 288x160x288 region reads in ~170 ms off the main thread and pans in ~0.4 MB deltas).
max_region:
  x: 288
  y: 384
  z: 288
  # Max blocks in one region (dx*dy*dz). 16M ids are 64 MB per copy on the server.
  blocks: 16777216
  # Max estimated snapshot JSON size in bytes, all parts together. One message is at most 4 MiB, so a client
  # without "sections_v1" gets region_too_large for anything bigger than that.
  bytes: 33554432
  # [area] Largest visible width (x and z) a headset may ask for: the region minus its view_margin on both sides
  # (PROTOCOL.md 4.25). The headset's width presets are 64/96/128/192/256 (left stick click); a wider request is
  # narrowed to this around its centre (moved by whole 16-block sections, so the reply is still a delta) instead of
  # refused, and the reply carries the accepted size. Keep it a multiple of 32 so a narrowed preset stays exactly
  # centred, and keep view_width + 2 * 16 (the headset's margin) within x/z above: 256 + 32 = 288.
  view_width: 256
