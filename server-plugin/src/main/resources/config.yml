# TabletopCraftAR plugin configuration. See docs/PROTOCOL.md.
bind:
  host: 0.0.0.0
  port: 8765
  path: /tabletop
auth:
  # Shared secret the headset sends in hello. Empty = auth disabled (LAN dev only).
  token: ""
region:
  # Default region sent after welcome. Origin is the min (north-west, bottom) corner.
  world: world
  origin: { x: 0, y: 60, z: 0 }
  dims: { x: 32, y: 64, z: 32 }
stream:
  # Full diff of every subscribed region every N ticks; catches /fill, /setblock, WorldEdit.
  safety-diff-ticks: 20
  # player_positions every N ticks (2 = 10 Hz).
  players-every-ticks: 2
  # Players within region XZ bounds + this margin are sent.
  players-margin: 16
  # Send chunk_snapshot as 16^3 sections (split into messages, deltas when the region moves by whole sections) to
  # clients that advertise "sections_v1" (PROTOCOL.md 4.18). false = always one rle_palette_v1 message.
  sections-v1: true
  # Target size of one sectioned chunk_snapshot message (bytes of JSON).
  max-message-bytes: 1048576
  # Per-block light and 4x4x4 biomes for clients that ask for them in hello.caps (light_v1 / biomes_v1,
  # PROTOCOL.md 4.4.1). Clients without those caps never pay the bytes. Set false to never send them.
  light: true
  biomes: true
avatar:
  # Real metres per block on the table; the Quest overrides it with avatar_config.
  block-size-m: 0.01
  # Cap on the Mannequin SCALE attribute (16 = 28.8 blocks tall, the attribute's maximum).
  max-scale: 16.0
  # Real height of the headset user. Hand offsets are scaled by giant height / this.
  user-height-m: 1.75
  # Where the giant stands (ARCHITECTURE.md 3.5):
  #   ground: on the terrain under the headset's head X/Z, clamped into the region; head turns with the
  #           headset; hands keep your real head-to-hand offsets scaled up to the giant's size.
  #   exact:  head and hands at exactly origin + pose / block-size-m (far away and high up at small block sizes).
  placement: ground
  # Per-tick smoothing of the giant's position and head rotation, 0.05..1 (1 = off). Jumps over 16 blocks snap.
  smoothing: 0.5
  # Java account whose skin the giant wears when the headset sends no skin_player (tabletop.json). The server
  # looks it up on the Mojang API (works in offline mode too, needs internet); Java clients also resolve it.
  skin-player: ""
  # Teleport/transform interpolation of the hand displays, in ticks.
  interpolation-ticks: 2
  # Spawn the giant when poses arrive even if no avatar_config was sent.
  spawn-on-first-pose: true
  despawn-after-disconnect-ms: 10000
debug:
  # Broadcast avatar_state with a "debug" object (entity positions) every 10 ticks.
  avatar-state: false
  log-poses: false
# Server caps for region_request / subscribe / setsize (PROTOCOL.md 4.13).
# Sized for a 256-block visible box plus the headset's 16-block view margin (docs/TESTING.md "Navigation and bigger
# areas": a 288x160x288 region reads in ~170 ms off the main thread and pans in ~0.4 MB deltas).
max_region:
  x: 288
  y: 384
  z: 288
  # Max blocks in one region (dx*dy*dz). 16M ids are 64 MB per copy on the server.
  blocks: 16777216
  # Max estimated snapshot JSON size in bytes, all parts together. One message is at most 4 MiB, so a client
  # without "sections_v1" gets region_too_large for anything bigger than that.
  bytes: 33554432
