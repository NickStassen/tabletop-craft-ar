# TabletopCraftAR plugin configuration. See docs/PROTOCOL.md.
bind:
  host: 0.0.0.0
  port: 8765
  path: /tabletop
auth:
  # Shared secret the headset sends in hello. Empty = auth disabled (LAN dev only).
  token: ""
region:
  # Default region sent after welcome. Origin is the min (north-west, bottom) corner.
  world: world
  origin: { x: 0, y: 60, z: 0 }
  dims: { x: 32, y: 64, z: 32 }
stream:
  # Full diff of every subscribed region every N ticks; catches /fill, /setblock, WorldEdit.
  safety-diff-ticks: 20
  # player_positions every N ticks (2 = 10 Hz).
  players-every-ticks: 2
  # Players within region XZ bounds + this margin are sent.
  players-margin: 16
  # Send chunk_snapshot as 16^3 sections (split into messages, deltas when the region moves by whole sections) to
  # clients that advertise "sections_v1" (PROTOCOL.md 4.18). false = always one rle_palette_v1 message.
  sections-v1: true
  # Target size of one sectioned chunk_snapshot message (bytes of JSON).
  max-message-bytes: 1048576
avatar:
  # Real metres per block on the table; the Quest overrides it with avatar_config.
  block-size-m: 0.01
  max-scale: 16.0
  user-height-m: 1.75
  skin-player: ""
  interpolation-ticks: 2
  # Spawn the giant when poses arrive even if no avatar_config was sent.
  spawn-on-first-pose: true
  despawn-after-disconnect-ms: 10000
debug:
  # Broadcast avatar_state with a "debug" object (entity positions) every 10 ticks.
  avatar-state: false
  log-poses: false
# Server caps for region_request / subscribe / setsize (PROTOCOL.md 4.13).
max_region:
  x: 128
  y: 384
  z: 128
  # Max blocks in one region (dx*dy*dz).
  blocks: 2097152
  # Max estimated chunk_snapshot JSON size in bytes (hard frame limit is 4 MiB).
  bytes: 4194304
