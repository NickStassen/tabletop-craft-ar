name: TabletopCraftAR
version: '${version}'
main: dev.tabletopcraft.ar.TabletopPlugin
api-version: '26.3'
description: Streams a tabletop region to an AR headset and drives a giant avatar from headset poses.
# Optional: Bedrock players through Geyser/Floodgate (BedrockSupport, called by reflection; no hard dependency).
softdepend: [floodgate, Geyser-Spigot]
commands:
  tabletop:
    description: Tabletop AR controls
    usage: /tabletop <status|setorigin [x y z]|setsize dx dy dz|avatar <spawn|remove|status|placement|skin|blocksize>|entities|reload|tell <message>|unfreeze-all|assets [rebuild|dir <folder>]>
# Every /tabletop subcommand needs tabletop.admin except "tell" (tabletop.tell): the plugin checks per subcommand.
permissions:
  tabletop.admin:
    default: op
  tabletop.tell:
    description: Whisper to the headsets with /tabletop tell <message>
    default: true
  tabletop.notify:
    description: 'See "[Tabletop: /command]" when a headset runs a command'
    default: op
