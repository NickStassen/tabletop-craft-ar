name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test plugin
        working-directory: server-plugin
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: tabletop-plugin, path: server-plugin/build/libs/*.jar }
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Lint and test fake client
        working-directory: tools
        run: |
          pip install -r requirements.txt pytest ruff
          ruff check .
          pytest -q
  quest-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Engine-free C# tests (JSON, RLE, greedy mesher, pose frame)
        working-directory: quest-app/Tests~
        run: dotnet run
