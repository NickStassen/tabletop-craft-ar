name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test plugin
        working-directory: server-plugin
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with: { name: tabletop-plugin, path: server-plugin/build/libs/*.jar }
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Lint and test fake client
        working-directory: tools
        run: |
          pip install -r requirements.txt pytest ruff
          ruff check .
          pytest -q
  quest-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - name: Engine-free C# tests (JSON, RLE, greedy mesher, pose frame)
        working-directory: quest-app/Tests~
        run: dotnet run
  starter-windows:
    # The Windows server starter end to end on a clean machine: start.bat (Windows PowerShell 5.1) into a folder with a
    # space in its name, answers on stdin (EULA yes, open server no, firewall yes), Bedrock on; then a re-run (updates,
    # no questions) and tools/ci/windows-starter-check.ps1 (files, settings, firewall rules, one server start). A
    # stand-in launcher folder under %APPDATA% (two placeholder files, no game content) checks that the plugin finds it.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '25' }
      - name: Stand-in Minecraft launcher folder (placeholder files only)
        shell: pwsh
        run: |
          $v = Join-Path $env:APPDATA '.minecraft\versions\26.3'
          New-Item -ItemType Directory -Force -Path $v | Out-Null
          $src = Join-Path $env:RUNNER_TEMP 'standin'
          New-Item -ItemType Directory -Force -Path "$src\assets\tabletop-ci" | Out-Null
          Set-Content -Path "$src\assets\tabletop-ci\placeholder.txt" -Value 'CI placeholder, not game content'
          Compress-Archive -Path "$src\assets" -DestinationPath "$v\26.3.zip" -Force
          Move-Item -Force "$v\26.3.zip" "$v\26.3.jar"
          Set-Content -Path "$v\26.3.json" -Value '{"id":"26.3"}'
      - name: First run of start.bat
        shell: cmd
        run: |
          (echo y& echo n& echo y) > "%RUNNER_TEMP%\answers.txt"
          call server-starter\start.bat -Dir "%RUNNER_TEMP%\Tabletop Server" -Bedrock yes -NoStart < "%RUNNER_TEMP%\answers.txt"
      - name: Second run (update, no questions)
        shell: cmd
        run: |
          call server-starter\start.bat -Dir "%RUNNER_TEMP%\Tabletop Server" -NoStart < NUL > "%RUNNER_TEMP%\rerun.txt"
          type "%RUNNER_TEMP%\rerun.txt"
          findstr /C:"up to date" "%RUNNER_TEMP%\rerun.txt"
      - name: Check the install and start the server once
        shell: pwsh
        run: ./tools/ci/windows-starter-check.ps1 -Dir (Join-Path $env:RUNNER_TEMP 'Tabletop Server')
